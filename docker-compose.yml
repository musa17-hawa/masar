# Masar + its own Cloudflare Tunnel. Put TUNNEL_TOKEN and ADMIN_* in .env, then:  docker compose up -d --build
services:
  masar:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "${MASAR_PORT:-3000}:3000"   # LAN access; the tunnel does not need this

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env (Cloudflare Zero Trust > Networks > Tunnels > your tunnel > Install connector)}
    depends_on: [masar]
